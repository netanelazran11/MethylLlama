[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "methyllama"
version = "1.0.0"
description = "MethylLlama: a foundation model for DNA methylation profiles, pretrained with the Whole-CpG Encoder-Decoder (WCED)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10,<3.14"
# Ranges admit the versions the manuscript ran with (requirements-lock.txt has the exact set).
dependencies = [
    "bmfm-targets @ git+https://github.com/BiomedSciAI/biomed-multi-omic.git@7b9c139a9ff1c417ef9424acc865fc513775eec7",
    "torch>=2.1",
    "pytorch-lightning>=2.2",
    "torchmetrics==1.1.0",
    "transformers>=4.54",
    "numpy<2",
    "scipy<1.15",
    "pandas>=2,<3",
    "anndata>=0.10",
    "scanpy>=1.10",
    "h5py>=3.9",
    "scikit-learn>=1.3",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
]

[project.optional-dependencies]
# figures and analyses in scripts/
analysis = ["matplotlib>=3.7", "umap-learn>=0.5", "pyarrow>=14"]
# experiment tracking used by the training scripts (set WANDB_MODE=offline to log locally)
wandb = ["wandb>=0.16"]
# notebooks in tutorials/
tutorials = ["huggingface_hub>=0.20", "matplotlib>=3.7", "umap-learn>=0.5", "jupyter"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bmfm_methylation*"]
